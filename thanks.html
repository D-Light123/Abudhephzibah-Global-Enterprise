<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Abudhephzibah Global Enterprise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thank-you-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 700px;
        }

        .thank-you-card .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .thank-you-card h1 {
            color: #764ba2;
            font-size: 42px;
            margin-bottom: 20px;
        }

        .thank-you-card p {
            color: #555;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .thank-you-card .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .thank-you-card .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }

        .thank-you-card .btn.whatsapp {
            background: #25D366;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .thank-you-card {
                padding: 35px 25px;
            }

            .thank-you-card h1 {
                font-size: 32px;
            }

            .thank-you-card .btn {
                display: block;
                margin: 10px 0;
            }

            .thank-you-card .btn.whatsapp {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="icon">✅</div>
        <h1>Thank You!</h1>
        <p>
            Your order has been submitted successfully. We will contact you soon to confirm 
            the details and arrange delivery.
        </p>
        <p>
            You can also reach us directly on WhatsApp if you need immediate assistance.
        </p>
        <a href="index.html" class="btn">🏠 Back to Home</a>
        <a href="https://wa.me/2348169710765?text=Hello, I just placed an order online" class="btn whatsapp" target="_blank">💬 Chat on WhatsApp</a>
    </div>

</body>
</html>
